[project]
name = "bilibili-live-helper"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sherpa-onnx>=1.13.8",
    "sounddevice>=0.5.6",
    "websockets>=17.1",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
